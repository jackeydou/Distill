[package]
name = "distill-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "distill"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
distill-core = { version = "0.0.1", path = "../distill-core", features = ["schema"] }
serde = "1.0.229"
serde_json = "1.0.151"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
