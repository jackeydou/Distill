[package]
name = "distill-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "distill"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
distill-core = { version = "0.0.1", path = "../distill-core", features = ["schema"] }
getrandom = "0.4.3"
listeners = "0.6.1"
notify-debouncer-mini = "0.7.0"
open = "5.4.4"
rmcp = { version = "3.4.1", features = ["server", "transport-io", "macros"] }
rust-embed = { version = "8.12.0", features = ["mime-guess", "interpolate-folder-path"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "io-std", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
ts-rs = "12.0.1"
ureq = { version = "3.4.2", default-features = false }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
walkdir = "2.5.0"
