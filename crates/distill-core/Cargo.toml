[package]
name = "distill-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
directories = "6.0.0"
fastembed = { version = "7.1.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
jiff = "0.2.37"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
schemars = { version = "1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
ts-rs = "12.0.1"
ulid = "3.0.0"
walkdir = "2.5.0"
yaml_serde = "0.10.7"

[features]
# JSON Schema for the save request, used by the MCP server.
schema = ["dep:schemars"]

[lints]
workspace = true

