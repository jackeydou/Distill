[tools]
rust = { version = "1.95", components = "rustfmt,clippy" }
node = "22"
pnpm = "10.30.2"
jq = "1.8"

[tasks.fmt]
description = "Format all Rust and web code"
run = ["cargo fmt --all", "pnpm -C apps/web format"]

[tasks."web:install"]
description = "Install the web UI's dependencies"
run = "pnpm install --frozen-lockfile"

[tasks."web:build"]
description = "Build the web UI into apps/web/dist, which `distill` embeds"
depends = ["web:install"]
run = "pnpm -C apps/web build"

[tasks.check]
description = "Everything a change must pass before it is done"
depends = ["web:install"]
# cargo test regenerates the ts-rs API types before the web checks read them.
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "pnpm -C apps/web lint",
  "pnpm -C apps/web typecheck",
  "pnpm -C apps/web test",
  "pnpm -C apps/web build",
]

[tasks.install]
description = "Build the web UI and install the distill binary with it embedded"
depends = ["web:build"]
run = "cargo install --path crates/distill-cli --locked"

[tasks."build:plugins"]
description = "Build per-agent plugin directories under dist/plugins (args: claude-code, codex)"
run = "scripts/build-plugins.sh"
