[workspace]
resolver = "3"
members = ["crates/distill-core", "crates/distill-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.lints.rust]
# `deny`, not `forbid`, so the one audited exception can opt in:
# crates/distill-core/src/index/vec.rs registers sqlite-vec with SQLite.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
